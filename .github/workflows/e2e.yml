# Lane 07 e2e gate: Playwright specs over the local workerd runner.
# This lane owns the whole e2e track: tests/e2e/**, playwright.config.ts,
# this workflow, the Playwright dependency and the runner it drives.
# (Adopted from L5 PR #97; the prior L5 grant is revoked.)
# Until specs exist, the job reports pending (green) instead of failing
# on an empty suite — it self-activates when specs arrive.
name: e2e

on:
  pull_request:
    paths:
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - "scripts/**"
      - "tsconfig*.json"
      - "compiler/**"
      - ".github/workflows/e2e.yml"
      - "packages/**"
      # The hand-built fixture witnesses examples/TeamTasks.can bytes;
      # without this, example replans (slice 23) break e2e silently.
      - "examples/**"
  push:
    branches: ["main"]
    paths:
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - "scripts/**"
      - "tsconfig*.json"
      - "compiler/**"
      - ".github/workflows/e2e.yml"
      - "packages/**"
      - "examples/**"
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.99.0"
      - name: Install from lock
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install chromium
        run: bunx playwright install --with-deps chromium
      - name: Build lane-07 dists
        run: bun run build
      - name: Emit Values catalog for compiled fixtures
        run: bun run catalog
      - name: Build compiler for compiled fixtures
        run: bun run build:compiler
      - name: Typecheck e2e harness
        run: bun run typecheck:e2e
      - name: Run e2e (or report pending)
        run: |
          set -u
          if [ ! -f playwright.config.ts ]; then
            echo "e2e pending: playwright.config.ts not yet authored."
            exit 0
          fi
          if [ -z "$(find tests/e2e -name '*.spec.ts' -print -quit 2>/dev/null)" ]; then
            echo "e2e pending: no tests/e2e specs yet."
            exit 0
          fi
          bun run test:e2e
