name: lane-02 values

on:
  push:
    branches:
      - "muse/lane-02-values/**"
    paths:
      - "packages/values/**"
      - "packages/contracts/src/values.ts"
      - ".github/workflows/lane-02.yml"
  pull_request:
    paths:
      - "packages/values/**"
      - "packages/contracts/src/values.ts"
      - ".github/workflows/lane-02.yml"
  workflow_dispatch:

jobs:
  values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      # Root install: the single lane-07-owned bun.lock covers every
      # workspace member. Run steps stay in the member dir; `bun run test`
      # (never bare `bun test`) executes the package's own node:test script.
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: packages/values
        run: bun run typecheck
      - name: Build and test
        working-directory: packages/values
        run: bun run test
      - name: Emit catalog
        working-directory: packages/values
        run: bun run catalog
