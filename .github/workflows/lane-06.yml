# Lane 06 CI: build + test owned workspace packages. Install runs at the root
# workspace from the committed lane-07-owned bun.lock (join J1 routes the
# exact member manifests there).
name: lane-06

permissions:
  contents: read

on:
  push:
    branches:
      - 'muse/lane-06-identity-interfaces/**'
    paths:
      - 'packages/identity/**'
      - 'packages/interfaces/**'
      - 'packages/contracts/src/identity.ts'
      - 'packages/contracts/src/wire.ts'
      - '.github/workflows/lane-06.yml'
  pull_request:
    paths:
      - 'packages/identity/**'
      - 'packages/interfaces/**'
      - 'packages/contracts/src/identity.ts'
      - 'packages/contracts/src/wire.ts'
      - '.github/workflows/lane-06.yml'

jobs:
  contracts-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Guard package API imports
        run: |
          # Consumers use declared exports; a sibling source path bypasses the producer build.
          if grep -RnE "(\.\./)+contracts/(src|dist)/" packages/identity/src packages/identity/test packages/interfaces/src packages/interfaces/test; then
            exit 1
          fi
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Build contracts assembly
        # Owned production sources import the @canlang/contracts public
        # assembly (dist), avoiding the L7-flagged conflicted names.
        run: bun run build --filter=@canlang/contracts
      - name: Build consumed values
        run: bun run build --filter=@canlang/values
      - name: Build consumed identity and UI
        run: bun run build --filter=@canlang/identity --filter=@canlang/ui
      - name: Test owned packages
        run: bun run --filter @canlang/identity --filter @canlang/interfaces test
