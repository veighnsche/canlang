# Lane 06 CI: build + test owned packages only. Self-contained until L7 join J1
# provides the root workspace; then this workflow adopts the shared install.
name: lane-06

permissions:
  contents: read

on:
  push:
    branches:
      - 'muse/lane-06-identity-interfaces/**'
    paths:
      - 'packages/identity/**'
      - 'packages/interfaces/**'
      - 'packages/contracts/src/identity.ts'
      - 'packages/contracts/src/wire.ts'
      - '.github/workflows/lane-06.yml'
  pull_request:
    paths:
      - 'packages/identity/**'
      - 'packages/interfaces/**'
      - 'packages/contracts/src/identity.ts'
      - 'packages/contracts/src/wire.ts'
      - '.github/workflows/lane-06.yml'

jobs:
  contracts-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        package: [identity, interfaces]
    steps:
      - uses: actions/checkout@v4
      - name: Guard owned-contract imports
        run: |
          # Lane-06 tests may import only lane-06-owned contract files until
          # L7 join J1 wires the workspace package.
          imports=$(grep -rho "contracts/src/[a-z0-9_]*\.js" 'packages/${{ matrix.package }}/test' | sort -u)
          echo "$imports"
          echo "$imports" | grep -v -E 'contracts/src/(identity|wire)\.js' && exit 1 || exit 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json
      - name: Install
        working-directory: packages/${{ matrix.package }}
        run: npm ci
      - name: Build
        working-directory: packages/${{ matrix.package }}
        run: npm run build
      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: npm run test
