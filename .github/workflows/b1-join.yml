# B1 join gate: b1_join test + TeamTasks.can honest-gap pin against the REAL
# lane-02 catalog. build-catalog emits packages/values/dist/catalog.json;
# b1-gate proves the join test PASSES (not skips) and the CLI pins exit 10
# with exactly seven source-profile E6008 refusals and no artifact.
name: b1-join

on:
  pull_request:
    paths:
      - "compiler/**"
      - "packages/values/**"
      - "packages/contracts/src/artifact.ts"
      - "examples/TeamTasks.can"
      - ".github/workflows/b1-join.yml"
  push:
    branches: ["main"]
    paths:
      - "compiler/**"
      - "packages/values/**"
      - "packages/contracts/src/artifact.ts"
      - "examples/TeamTasks.can"
      - ".github/workflows/b1-join.yml"

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install from lock
        run: bun install --frozen-lockfile
      - name: Build values dist and emit catalog
        # The catalog task builds values and its declared producers first.
        run: bun run catalog
      - name: Print catalog version and entry count
        run: node -e "const c = require('./packages/values/dist/catalog.json'); console.log('catalog', c.catalog_version + ':', c.entries.length, 'entries,', c.features.length, 'features');"
      - name: Upload catalog
        uses: actions/upload-artifact@v4
        with:
          name: values-catalog
          path: packages/values/dist/catalog.json

  b1-gate:
    runs-on: ubuntu-latest
    needs: build-catalog
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.99.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Download catalog into dist
        uses: actions/download-artifact@v4
        with:
          name: values-catalog
          path: packages/values/dist/
      - name: B1 join test (must PASS STRICT, not skip)
        run: |
          set -o pipefail
          cargo test --locked --test b1_join -- --nocapture 2>&1 | tee /tmp/b1_join.log
          grep -q "2 passed" /tmp/b1_join.log || { echo "FAIL: b1_join did not pass both joins"; exit 1; }
          grep -q "SKIP b1_teamtasks_artifact\|SKIP b2_expenseflow_artifact" /tmp/b1_join.log && { echo "FAIL: b1_join SKIPPED (catalog missing?) — strict proof required"; exit 1; }
          echo "proves: b1_join passed STRICT against the real catalog (both joins, zero SKIP)"
        working-directory: compiler
      - name: Build can
        run: cargo build --locked
        working-directory: compiler
      - name: Honest-gap pin (exit 10, seven exact E6008 refusals, no artifact)
        run: |
          set +e
          ./target/debug/can compile ../examples/TeamTasks.can --format=json --catalog ../packages/values/dist/catalog.json > /tmp/team_tasks.json
          code=$?
          set -e
          cat /tmp/team_tasks.json
          [ "$code" -eq 10 ] || { echo "FAIL: expected exit 10, got $code"; exit 1; }
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const result = JSON.parse(readFileSync('/tmp/team_tasks.json', 'utf8'));
          assert.equal(result.tool, 'can');
          assert.equal(result.schema_version, 1);
          assert.equal(result.complete, true);
          assert.equal(result.omitted, 0);
          assert.equal(result.diagnostics.length, 7);
          assert.ok(result.diagnostics.every(d => d.code === 'E6008' && d.severity === 'error'));
          for (const [profile, count] of [
            ['cannot lower tooltip:', 1],
            ['cannot lower collapse:', 1],
            ['cannot lower breadcrumbs:', 2],
            ['cannot lower edit:', 2],
            ['cannot lower list: option filter', 1],
          ]) {
            assert.equal(result.diagnostics.filter(d => d.message.startsWith(profile)).length, count, profile);
          }
          for (const key of ['artifact_version', 'modules', 'operations', 'models', 'tests']) {
            assert.ok(!Object.hasOwn(result, key), `blocked compile published ${key}`);
          }
          NODE
          echo "proves: TeamTasks.can exits 10 with tooltip/collapse x1, breadcrumbs/edit x2, filter x1, zero other codes and no artifact"
        working-directory: compiler
