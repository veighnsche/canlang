# B1 join gate: b1_join test + TeamTasks.can honest-gap pin against the REAL
# lane-02 catalog. build-catalog emits packages/values/dist/catalog.json;
# b1-gate proves the join test PASSES (not skips) and the CLI pins exit 10
# with exactly 10xE6008 and zero other error codes.
name: b1-join

on:
  pull_request:
    paths:
      - "compiler/**"
      - "packages/values/**"
      - "packages/contracts/src/artifact.ts"
      - "examples/TeamTasks.can"
      - ".github/workflows/b1-join.yml"
  push:
    branches: ["main"]
    paths:
      - "compiler/**"
      - "packages/values/**"
      - "packages/contracts/src/artifact.ts"
      - "examples/TeamTasks.can"
      - ".github/workflows/b1-join.yml"

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install from lock
        run: bun install --frozen-lockfile
      - name: Build values dist and emit catalog
        # packages/values "catalog" script = build (tsc) + emit-catalog.mjs.
        run: bun run catalog
        working-directory: packages/values
      - name: Print catalog version and entry count
        run: node -e "const c = require('./packages/values/dist/catalog.json'); console.log('catalog', c.catalog_version + ':', c.entries.length, 'entries,', c.features.length, 'features');"
      - name: Upload catalog
        uses: actions/upload-artifact@v4
        with:
          name: values-catalog
          path: packages/values/dist/catalog.json

  b1-gate:
    runs-on: ubuntu-latest
    needs: build-catalog
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Download catalog into dist
        uses: actions/download-artifact@v4
        with:
          name: values-catalog
          path: packages/values/dist/
      - name: B1 join test (must PASS, not skip)
        run: |
          set -o pipefail
          cargo test --test b1_join 2>&1 | tee /tmp/b1_join.log
          grep -q "1 passed" /tmp/b1_join.log || { echo "FAIL: b1_join did not pass (skipped or failed)"; exit 1; }
          echo "proves: b1_join passed against the real catalog (not skipped)"
        working-directory: compiler
      - name: Build can
        run: cargo build
        working-directory: compiler
      - name: Honest-gap pin (exit 10, 10xE6008, zero other codes)
        run: |
          set +e
          ./target/debug/can compile ../examples/TeamTasks.can --catalog ../packages/values/dist/catalog.json > /tmp/team_tasks.log 2>&1
          code=$?
          cat /tmp/team_tasks.log
          [ "$code" -eq 10 ] || { echo "FAIL: expected exit 10, got $code"; exit 1; }
          e6008=$(grep -c "E6008" /tmp/team_tasks.log)
          [ "$e6008" -eq 10 ] || { echo "FAIL: expected exactly 10 E6008 lines, got $e6008"; exit 1; }
          other=$(grep -oE "E[0-9]{4}" /tmp/team_tasks.log | grep -v "E6008" | wc -l)
          [ "$other" -eq 0 ] || { echo "FAIL: $other non-E6008 error codes present"; exit 1; }
          echo "proves: TeamTasks.can exits 10 with exactly 10 E6008 and zero other codes"
        working-directory: compiler
