name: lane-03 state

on:
  push:
    branches:
      - 'muse/lane-03-state/**'
    paths:
      - 'packages/state/**'
      - 'packages/stdlib/**'
      - 'packages/contracts/src/state.ts'
      - '.github/workflows/lane-03.yml'
  pull_request:
    paths:
      - 'packages/state/**'
      - 'packages/stdlib/**'
      - 'packages/contracts/src/state.ts'
      - '.github/workflows/lane-03.yml'

jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install state package
        working-directory: packages/state
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: packages/state
        run: npm run typecheck
      - name: Build and test
        working-directory: packages/state
        run: npm test
  stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace
        run: npm ci --no-audit --no-fund
      - name: Build @canlang/values
        run: npm run build -w @canlang/values
      - name: Typecheck stdlib
        run: npm run typecheck -w @canlang/stdlib
      - name: Build and test stdlib
        run: npm test -w @canlang/stdlib
