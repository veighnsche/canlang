name: lane-03 state

on:
  push:
    branches:
      - 'muse/lane-03-state/**'
    paths:
      - 'packages/state/**'
      - 'packages/stdlib/**'
      - 'packages/contracts/src/state.ts'
      - '.github/workflows/lane-03.yml'
  pull_request:
    paths:
      - 'packages/state/**'
      - 'packages/stdlib/**'
      - 'packages/contracts/src/state.ts'
      - '.github/workflows/lane-03.yml'

jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Build consumed contracts
        run: bun run build --filter=@canlang/contracts
      - name: Typecheck
        working-directory: packages/state
        run: bun run typecheck
      - name: Build and test
        working-directory: packages/state
        run: bun run test
  stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Build consumed contracts
        run: bun run build --filter=@canlang/contracts
      - name: Build @canlang/values
        run: bun run build --filter=@canlang/values
      - name: Typecheck stdlib
        run: bun run --filter @canlang/stdlib typecheck
      - name: Build and test stdlib
        run: bun run --filter @canlang/stdlib test
