name: lane-01 language and toolchain

on:
  push:
    branches: ["muse/lane-01-language/**"]
    paths:
      - "compiler/**"
      - "draft"
      - ".gitmodules"
      - "editors/vscode/**"
      - "packages/contracts/src/artifact.ts"
      - "packages/contracts/src/diagnostic.ts"
      - ".github/workflows/lane-01.yml"
  pull_request:
    paths:
      - "compiler/**"
      - "draft"
      - ".gitmodules"
      - "editors/vscode/**"
      - "packages/contracts/src/artifact.ts"
      - "packages/contracts/src/diagnostic.ts"
      - ".github/workflows/lane-01.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
        working-directory: compiler
      - name: Clippy (warnings denied)
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: compiler
      - name: Build
        run: cargo build --locked
        working-directory: compiler
      - name: Test
        run: cargo test --locked
        working-directory: compiler

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Typecheck owned contract boundaries
        # packages/contracts assembly (package.json/index) is lane 7 owned;
        # lane 1 verifies its two files standalone until the join lands.
        run: bunx -p typescript@5.9.3 tsc --noEmit --strict --lib ES2023 --skipLibCheck packages/contracts/src/artifact.ts packages/contracts/src/diagnostic.ts

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Validate extension manifests and grammar JSON
        run: >
          node -e "for (const f of ['editors/vscode/package.json','editors/vscode/syntaxes/can.tmLanguage.json']) { JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('ok', f); }"
      - name: Typecheck LSP client (no emit)
        # Empty type root reproduces the release job's check isolation: the
        # ambient require shim in client.ts collides with workspace
        # @types/node, and bare tsc auto-includes it (red under npm too).
        run: |
          mkdir -p /tmp/empty-typeroot
          bunx -p typescript@5.9.3 tsc --noEmit --strict --target es2022 --lib es2022 --typeRoots /tmp/empty-typeroot editors/vscode/src/extension.ts editors/vscode/src/client.ts
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.99.0"
      - name: Build can (debug, for LSP round-trip)
        run: cargo build --locked
        working-directory: compiler
      - name: LSP capability round-trip (real binary)
        # Guards the server contract the extension client consumes.
        run: node test/lsp-capabilities.cjs
        working-directory: editors/vscode
        env:
          CAN_BIN: ${{ github.workspace }}/compiler/target/debug/can
