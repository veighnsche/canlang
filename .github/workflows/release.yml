# Release assembly: one coherent CLI/library/editor bundle.
# Builds every shippable artifact and uploads them to the workflow run.
# Tag pushes also publish the qualified standalone installer assets to GitHub
# Releases and the same offline tools to GHCR. Manual dispatch assembles only.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-binary:
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    strategy:
      matrix:
        include:
          # Match the standalone qualification host so a newer latest image
          # cannot silently raise the compiler's glibc requirement.
          - runner: ubuntu-24.04
            name: can-linux-x86_64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "stable"
      - name: Verify release host
        run: |
          test "$(rustc -Vv | sed -n 's/^host: //p')" = "${{ matrix.target }}"
      - name: Build can (release, locked)
        run: cargo build --release --locked
        working-directory: compiler
      - name: Build native development server (release, locked)
        run: cargo build --release --locked --manifest-path dev-server/Cargo.toml --target-dir compiler/target
      - name: Size report
        run: |
          ls -l target/release/can
          printf 'bytes=%s\n' "$(wc -c < target/release/can | tr -d ' ')"
        working-directory: compiler
      - name: Prepare verified dependency notices
        run: |
          python3 scripts/check-compiler-release-notices.py --target "${{ matrix.target }}" --output-dir compiler/target/release
          python3 scripts/check-dev-server-release-notices.py --target "${{ matrix.target }}" --output-dir compiler/target/release
      - name: Checksums (sha256)
        run: |
          cd compiler/target/release
          shasum -a 256 can can-dev THIRD-PARTY-NOTICES.txt DEV-SERVER-THIRD-PARTY-NOTICES.txt > "SHA256SUMS-${{ matrix.name }}.txt"
          cat "SHA256SUMS-${{ matrix.name }}.txt"
          shasum -a 256 -c "SHA256SUMS-${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            compiler/target/release/can
            compiler/target/release/can-dev
            compiler/target/release/THIRD-PARTY-NOTICES.txt
            compiler/target/release/DEV-SERVER-THIRD-PARTY-NOTICES.txt
            compiler/target/release/SHA256SUMS-${{ matrix.name }}.txt

  node-libraries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install from lock
        run: bun install --frozen-lockfile
      - name: Build, verify and pack complete workspace artifacts
        # Private runtime dependencies travel with the artifact set.
        # Producer restoration precedes uncached validation and packing.
        run: bun run release:pack
      - uses: actions/upload-artifact@v7
        with:
          name: node-libraries
          path: output/release-artifacts/*

  editor-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install from lock
        run: bun install --frozen-lockfile
      - name: Compile the editor client
        working-directory: editors/vscode
        run: bun run compile
      - name: Archive the VSCode/Cursor extension payload
        run: |
          mkdir -p release-artifacts
          cd editors/vscode
          zip -r ../../release-artifacts/canlang-vscode.zip package.json README.md LICENSE language-configuration.json token-colors.json syntaxes images/*.svg images/icon*.png out src
      - name: Package VS Code extension (vsix)
        # No marketplace publish: artifact only (see header).
        run: |
          cd editors/vscode
          npx -y @vscode/vsce package --out ../../release-artifacts/canlang-vscode.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: editor-bundle
          path: |
            release-artifacts/canlang-vscode.zip
            release-artifacts/canlang-vscode.vsix

  standalone-install:
    needs: rust-binary
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            compiler: can-linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.compiler }}
          path: compiler/target/release
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Build production owners and packaging tools
        run: |
          bun install --frozen-lockfile
          bun run check:dependencies
          bun run build
          bun run catalog
          bun run release
          mkdir -p output/install-tools
          cp scripts/distribution/package.json scripts/distribution/bun.lock output/install-tools/
          bun install --production --ignore-scripts --frozen-lockfile --cwd output/install-tools
      - name: Assemble and qualify the standalone archive
        run: |
          chmod +x compiler/target/release/can compiler/target/release/can-dev
          node scripts/pack-install.mjs --compiler compiler/target/release/can --dev-server compiler/target/release/can-dev
          node scripts/verify-install.mjs
      - name: Assemble offline SodaOS tools
        run: node scripts/pack-tools.mjs --compiler compiler/target/release/can --dev-server compiler/target/release/can-dev --bun-license scripts/distribution/bun-LICENSE.md
      - name: Verify the direct workerd runtime
        run: node scripts/verify-soda-direct.mjs --state "$RUNNER_TEMP/can-soda-direct"
      - uses: actions/upload-artifact@v7
        with:
          name: can-install-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            output/install/can-*-${{ matrix.platform }}.tar.gz
            output/install/can-*-${{ matrix.platform }}.tar.gz.sha256
            output/install/can-browser-development-tools-*.tar.gz
            output/install/can-browser-development-tools-*.tar.gz.sha256
            output/install/size-report.json
            output/install/verification.json
            output/install/install.sh
            output/install/install-local.sh
            output/install/install-browser-tools.sh
            output/install/browser-development/*
      - uses: actions/upload-artifact@v7
        with:
          name: can-tools-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            output/tools/canlang-tools-linux-x86_64.tar.gz
            output/tools/canlang-release.json

  publish-install:
    needs: standalone-install
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'veighnsche/canlang'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: can-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          name: can-install-linux-x64
          path: output/publish-install/linux-x64
      - uses: actions/download-artifact@v8
        with:
          name: can-tools-linux-x64
          path: output/publish-install/tools
      - name: Publish qualified standalone release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-install-release.mjs output/publish-install

  publish-container:
    needs: standalone-install
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'veighnsche/canlang'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: can-container-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: can-tools-linux-x64
          path: output/tools
      - name: Build and check the offline CLI image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            const descriptor = JSON.parse(readFileSync("output/tools/canlang-release.json"));
            assert.equal(descriptor.sourceRevision, process.env.GITHUB_SHA);
            assert.equal(descriptor.archiveFilename, "canlang-tools-linux-x86_64.tar.gz");
            assert.equal(createHash("sha256").update(readFileSync("output/tools/" + descriptor.archiveFilename)).digest("hex"), descriptor.sha256);
          '
          image=ghcr.io/veighnsche/canlang:$RELEASE_TAG
          docker build --file scripts/distribution/Dockerfile.tools --build-arg VERSION="$RELEASE_TAG" --build-arg REVISION="$GITHUB_SHA" --tag "$image" output/tools
          actual=$(docker run --rm "$image" --version)
          case "$actual" in "can ${RELEASE_TAG#v} ("*) ;; *) echo "Unexpected compiler: $actual" >&2; exit 1 ;; esac
          docker run --rm "$image" --help
          docker run --rm --entrypoint /opt/canlang/bin/can-dev "$image" --version
          docker run --rm --entrypoint /opt/canlang/bin/can-soda "$image" --help
      - name: Publish GHCR image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image=ghcr.io/veighnsche/canlang
          docker push "$image:$RELEASE_TAG"
          case "$RELEASE_TAG" in
            *-*) ;;
            *) docker tag "$image:$RELEASE_TAG" "$image:latest"; docker push "$image:latest" ;;
          esac

  verify-public-install:
    needs: publish-install
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            shell: /bin/bash
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Verify public Linux core assets and streamed installation
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          INSTALL_SHELL: ${{ matrix.shell }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          base=https://github.com/veighnsche/canlang/releases/download/$RELEASE_TAG
          for asset in install.sh can-$version-linux-x64.tar.gz can-$version-linux-x64.tar.gz.sha256; do
            curl --fail --silent --show-error --location --head --proto '=https' --proto-redir '=https' "$base/$asset" > /dev/null
            echo "PASS public asset: $base/$asset"
          done
          scratch=$(mktemp -d "$RUNNER_TEMP/can-public-install.XXXXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          mkdir -p "$scratch/home with spaces" "$scratch/zsh config"
          export HOME="$scratch/home with spaces" CAN_INSTALL_DIR="$scratch/install with spaces" ZDOTDIR="$scratch/zsh config" SHELL="$INSTALL_SHELL"
          # Use the published installer and its default single latest-tag resolution.
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "$base/install.sh" | /bin/bash
          case "$INSTALL_SHELL" in
            /bin/zsh) /bin/zsh -f -c 'source "$ZDOTDIR/.zshrc"; command -v can; can --version' ;;
            *) /bin/bash --noprofile --norc -c '. "$HOME/.bashrc"; command -v can; can --version' ;;
          esac
          actual=$("$CAN_INSTALL_DIR/bin/can" --version)
          case "$actual" in "can $version ("*) ;; *) echo "Unexpected compiler: $actual" >&2; exit 1 ;; esac
          "$CAN_INSTALL_DIR/current/libexec/node" -e '
            const assert = require("node:assert/strict");
            const manifest = require(process.env.CAN_INSTALL_DIR + "/current/manifest.json");
            assert.equal(manifest.version, process.env.RELEASE_TAG.slice(1));
            assert.equal(manifest.platform, process.env.EXPECTED_PLATFORM);
            console.log("PASS public streamed install:", manifest.version, manifest.platform, process.version);
          '
