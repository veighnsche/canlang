# B2 join gate: B2 journey specs over the REAL producers (no live
# providers). build emits the lane-07 dists + values catalog; b2-gate
# proves the four B2 integration specs PASS (not skip) with their
# fail-loud producer loads and blocked rows intact.
name: b2-join

on:
  pull_request:
    paths:
      - "tests/integration/b2-*.ts"
      - "packages/testkit/src/fixtures/b2-*.ts"
      - "packages/testkit/src/fixtures/playback*.ts"
      - "packages/services/src/scenarios.ts"
      - "packages/services/src/mail/**"
      - "packages/services/src/http/**"
      - "packages/state/src/storage/**"
      - "packages/identity/src/**"
      - "packages/contracts/src/examples.ts"
      - "packages/contracts/src/services.ts"
      - "packages/contracts/src/state.ts"
      - "packages/contracts/src/identity.ts"
      - "packages/cloudflare/src/dev/**"
      - "vitest.config.ts"
      - ".github/workflows/b2-join.yml"
  push:
    branches: ["main"]
    paths:
      - "tests/integration/b2-*.ts"
      - "packages/testkit/src/fixtures/b2-*.ts"
      - "packages/testkit/src/fixtures/playback*.ts"
      - "packages/services/src/scenarios.ts"
      - "packages/services/src/mail/**"
      - "packages/services/src/http/**"
      - "packages/state/src/storage/**"
      - "packages/identity/src/**"
      - "packages/contracts/src/examples.ts"
      - "packages/contracts/src/services.ts"
      - "packages/contracts/src/state.ts"
      - "packages/contracts/src/identity.ts"
      - "packages/cloudflare/src/dev/**"
      - "vitest.config.ts"
      - ".github/workflows/b2-join.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install from lock
        run: bun install --frozen-lockfile
      - name: Build lane-07 dists
        run: bun run build
      - name: Build values dist and emit catalog
        run: bun run build:joins
      - name: Print dist versions
        run: node -e "for (const p of ['contracts','cloudflare','testkit']) { const m = require('./packages/' + p + '/package.json'); console.log('@canlang/' + p, m.version); }"
      - name: Pack dists
        run: tar -czf /tmp/b2-dists.tgz packages/contracts/dist packages/cloudflare/dist packages/testkit/dist packages/values/dist packages/identity/dist packages/ui/dist packages/interfaces/dist
      - name: Upload dists
        uses: actions/upload-artifact@v4
        with:
          name: b2-dists
          path: /tmp/b2-dists.tgz

  b2-gate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install from lock
        run: bun install --frozen-lockfile
      - name: Download and unpack dists
        uses: actions/download-artifact@v4
        with:
          name: b2-dists
          path: /tmp/b2-dists
      - name: Unpack dists
        run: tar -xzf /tmp/b2-dists/b2-dists.tgz
      - name: Typecheck lane-07 sources and assembly
        run: bun run typecheck
      - name: B2 journey specs (must PASS, not skip)
        run: |
          set -o pipefail
          bunx vitest run tests/integration/b2-delivery.test.ts tests/integration/b2-d1-fence.test.ts tests/integration/b2-do-local.test.ts tests/integration/b2-revocation.test.ts 2>&1 | tee /tmp/b2_join.log
          grep -q "Test Files.*4 passed" /tmp/b2_join.log || { echo "FAIL: B2 specs did not pass (skipped or failed)"; exit 1; }
          grep -q "Tests.*4 passed" /tmp/b2_join.log || { echo "FAIL: B2 spec count drifted (expected 4 tests passing)"; exit 1; }
          echo "proves: 4 B2 journey specs passed against the real producers (not skipped)"
