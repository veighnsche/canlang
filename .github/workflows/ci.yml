name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace:
    name: Workspace and installed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.99.0"
      - name: Install from lock
        run: bun install --frozen-lockfile
      - name: Build workspace packages
        run: bun run build
      - name: Check declared package boundaries
        run: bun run check:boundaries
      - name: Test package boundary guard
        run: bun run test:boundaries
      - name: Test CI gates and receipt verification
        run: bun run test:ci
      - name: Typecheck workspace assembly
        run: bun run typecheck
      - name: Build native preparation test prerequisite
        # Private debug binary for existing tests; never packed into releases.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/can-integration-preparation
        run: cargo +1.99.0 build --locked --bin can-preparation --manifest-path packages/cloudflare/preparation/Cargo.toml
      - name: Generate the real producer catalog
        run: bun run catalog
      - name: Build compiler for compiled runtime fixtures
        run: bun run build:compiler
      - name: Install Chromium and system dependencies for workspace tests
        run: bunx playwright install --with-deps chromium
      - name: Test all package and integration suites
        env:
          CAN_PREPARATION_BIN: ${{ runner.temp }}/can-integration-preparation/debug/can-preparation
        run: bun run test:all
      - name: Verify installed package declarations
        run: bun run verify:installed-types --skip-build
      - name: Verify installed Worker and assets
        run: bun run verify:installed-worker --skip-build
      - name: Verify deterministic library build (B5 reproducibility)
        run: |
          set -euo pipefail
          hash_dist() {
            local files
            files=$(find packages/*/dist \
              -type f \( -name '*.js' -o -name '*.d.ts' -o -name '*.map' \) | sort)
            if [ -z "$files" ]; then
              echo "determinism gate: no dist files found" >&2
              return 1
            fi
            echo "$files" | xargs sha256sum | sha256sum
          }
          bun run build:uncached
          hash_dist | tee /tmp/build-first.sha
          rm -rf packages/*/dist \
            packages/*/*.tsbuildinfo
          bun run build:uncached
          hash_dist | tee /tmp/build-second.sha
          cmp /tmp/build-first.sha /tmp/build-second.sha
      - name: Verify Turbo graph and cache restoration in isolation
        run: bun run verify:turbo-cache


  compiler:
    name: Compiler and editor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAN_COMPLETION_REQUIRE_ENGINES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - name: Install from lock
        run: bun install --frozen-lockfile
      - name: Ensure actual completion engines
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi
          command -v bash
          command -v zsh
          command -v python3
      - name: Format and lint compiler
        run: bun run lint:compiler
      - name: Build real package and catalog prerequisites
        run: |
          bun run build
          bun run catalog
          test -s packages/values/dist/catalog.json
      - name: Build compiler
        run: bun run build:compiler
      - name: Test compiler with real producers
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path compiler/Cargo.toml -- --nocapture 2>&1 | tee "$RUNNER_TEMP/compiler-tests.log"
          if grep -Eq "SKIP b1_teamtasks_artifact|SKIP b2_expenseflow_artifact" "$RUNNER_TEMP/compiler-tests.log"; then
            echo "Compiler artifact joins did not execute against the real catalog." >&2
            exit 1
          fi
      - name: Validate editor manifests and grammar
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; for (const file of ["editors/vscode/package.json","editors/vscode/syntaxes/can.tmLanguage.json"]) JSON.parse(readFileSync(file,"utf8"));'
      - name: Typecheck editor client
        run: |
          mkdir -p "$RUNNER_TEMP/editor-types"
          bunx tsc --noEmit --strict --target es2022 --lib es2022 --typeRoots "$RUNNER_TEMP/editor-types" editors/vscode/src/extension.ts editors/vscode/src/client.ts
      - name: Check real compiler LSP round-trip
        working-directory: editors/vscode
        env:
          CAN_BIN: ${{ github.workspace }}/compiler/target/debug/can
        run: node test/lsp-capabilities.cjs

  browser:
    name: Browser and security journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.99.0"
      - name: Install from lock
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium and system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Build actual runtime producers
        run: |
          bun run build
          bun run catalog
          bun run build:compiler
      - name: Typecheck browser harness
        run: bun run typecheck:e2e
      - name: Test browser and security journeys
        run: bun run test:e2e

  tools:
    name: Language tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test JEV caller without credentials
        run: python3 -m unittest discover -s tools -p test_jev.py
      - name: Test parser boundaries
        # The prototype corpus is superseded by the actual Rust corpus tests.
        run: |
          python3 - <<'PYTOOLS'
          import sys, unittest
          sys.path.insert(0, "tools")
          import test_can_parser
          loader = unittest.TestLoader()
          suite = unittest.TestSuite(
              test_can_parser.CanParserTests(name)
              for name in loader.getTestCaseNames(test_can_parser.CanParserTests)
              if "corpus" not in name
          )
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PYTOOLS
