name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  workspace:
    name: Workspace and installed artifacts
    runs-on: ubuntu-24.04
    # The complete native runtime corpus includes long multi-mode owner and
    # rollback journeys, followed by isolated installed-package checks.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: "22.0.0"
      - name: Retain declared minimum Node executable
        run: echo "CAN_MINIMUM_NODE22=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "stable"
          targets: wasm32-unknown-unknown
      - name: Install from lock
        run: bun install --frozen-lockfile
      - name: Build workspace packages
        run: bun run build
      - name: Check declared package boundaries
        run: bun run check:boundaries
      - name: Enforce no-unit-test gates
        run: bun run check:unitban
      - name: Test work-kernel native integration targets
        run: cargo test --locked --manifest-path packages/work-kernel/Cargo.toml --test registered_conformance --test numeric_text_corpus
      - name: Typecheck workspace assembly
        run: bun run typecheck
      - name: Build native preparation test prerequisite
        # Private debug binary for existing tests; never packed into releases.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/can-integration-preparation
        run: cargo build --locked --bin can-preparation --manifest-path packages/cloudflare/preparation/Cargo.toml
      - name: Generate the real producer catalog
        run: bun run catalog
      - name: Build compiler for compiled runtime fixtures
        run: bun run build:compiler
      - name: Install Chromium and system dependencies for workspace tests
        run: bunx playwright install --with-deps chromium
      - name: Test all package and integration suites
        env:
          CAN_PREPARATION_BIN: ${{ runner.temp }}/can-integration-preparation/debug/can-preparation
        run: bun run test:all
      - name: Verify installed package declarations
        run: bun run verify:installed-types --skip-build
      - name: Verify installed Worker and assets
        run: bun run verify:installed-worker --skip-build
      - name: Verify minimum Node installed declarations
        run: '"$CAN_MINIMUM_NODE22" scripts/verify-installed-types.mjs --skip-build --minimum-node22'
      - name: Verify minimum Node installed runtime and assets
        run: '"$CAN_MINIMUM_NODE22" scripts/verify-installed-worker.mjs --skip-build --minimum-node22'


  compiler:
    name: Compiler and editor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CAN_COMPLETION_REQUIRE_ENGINES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "stable"
          components: rustfmt, clippy
      - name: Install from lock
        run: bun install --frozen-lockfile
      - name: Ensure actual completion engines
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi
          command -v bash
          command -v zsh
          command -v python3
      # Keep warnings fatal except argument-count/type-size style limits in
      # the compiler lint command; those do not establish correctness.
      - name: Format and lint compiler
        run: bun run lint:compiler
      - name: Build real package and catalog prerequisites
        run: |
          bun run build
          bun run catalog
          test -s packages/values/dist/catalog.json
      - name: Build compiler
        run: bun run build:compiler
      - name: Install Chromium for native rendering fixtures
        run: bunx playwright install --with-deps chromium
      - name: Test compiler with real producers
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path compiler/Cargo.toml -- --nocapture 2>&1 | tee "$RUNNER_TEMP/compiler-tests.log"
          if grep -Eq "SKIP b1_teamtasks_artifact|SKIP b2_expenseflow_artifact" "$RUNNER_TEMP/compiler-tests.log"; then
            echo "Compiler artifact joins did not execute against the real catalog." >&2
            exit 1
          fi
      - name: Test native development server with real SDK
        run: cargo test --locked --manifest-path dev-server/Cargo.toml
      - name: Validate portable editor grammar and editing configuration
        run: node editors/vscode/test/language-configuration.cjs
      - name: Compile editor client
        working-directory: editors/vscode
        run: bun run compile
      - name: Check real compiler LSP round-trip
        working-directory: editors/vscode
        env:
          CAN_BIN: ${{ github.workspace }}/compiler/target/debug/can
        run: |
          node test/lsp-capabilities.cjs
          bun run test:client

  browser:
    name: Browser and security journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "stable"
      - name: Install from lock
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium and system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Build actual runtime producers
        run: |
          bun run build
          bun run catalog
          bun run build:compiler
      - name: Typecheck browser harness
        run: bun run typecheck:e2e
      - name: Test browser and security journeys
        run: bun run test:e2e
