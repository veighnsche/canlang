# Lane 04: durable work, provider services and files.
# Owned paths only. Install runs once at the root bun workspace (the single
# lane-07-owned bun.lock covers every member); run steps stay per-package.
name: lane-04

on:
  push:
    branches:
      - 'muse/lane-04-work-services-files/**'
    paths:
      - 'packages/work/**'
      - 'packages/services/**'
      - 'packages/files/**'
      - 'packages/contracts/src/work.ts'
      - 'packages/contracts/src/services.ts'
      - 'packages/contracts/src/files.ts'
      - '.github/workflows/lane-04.yml'
  pull_request:
    paths:
      - 'packages/work/**'
      - 'packages/services/**'
      - 'packages/files/**'
      - 'packages/contracts/src/work.ts'
      - 'packages/contracts/src/services.ts'
      - 'packages/contracts/src/files.ts'
      - '.github/workflows/lane-04.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [work, services, files]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install workspace
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Build consumed contracts
        working-directory: .
        run: bun run build --filter=@canlang/contracts
      - name: Build work and files producers
        working-directory: .
        run: |
          case '${{ matrix.package }}' in
            work) bun run build --filter=@canlang/state ;;
            files) bun run build --filter=@canlang/services ;;
          esac
      - run: bun run typecheck
      - run: bun run test
