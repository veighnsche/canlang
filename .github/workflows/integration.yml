# Lane 07 integration gate: whole-repo health across lanes.
# Lane workflows (*lane-0N.yml*) stay with their owners; this file runs the
# complete workspace test graph plus the stdlib-only language tools.
name: integration

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.99.0"
      - name: Install from lock
        run: bun install --frozen-lockfile
      - name: Build workspace packages
        run: bun run build
      - name: Check declared package boundaries
        run: bun run check:boundaries
      - name: Test package boundary guard
        run: bun run test:boundaries
      - name: Test CI gates and receipt verification
        run: bun run test:ci
      - name: Typecheck workspace assembly
        run: bun run typecheck
      - name: Build native preparation test prerequisite
        # Private debug binary for existing tests; never packed into releases.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/can-integration-preparation
        run: cargo +1.99.0 build --locked --bin can-preparation --manifest-path packages/cloudflare/preparation/Cargo.toml
      - name: Generate catalog for emission fixture
        run: bun run catalog
      - name: Test all package and integration suites
        env:
          CAN_PREPARATION_BIN: ${{ runner.temp }}/can-integration-preparation/debug/can-preparation
        run: bun run test:all
      - name: Verify installed package declarations
        run: bun run verify:installed-types --skip-build
      - name: Verify installed Worker and assets
        run: bun run verify:installed-worker --skip-build
      - name: Verify deterministic library build (B5 reproducibility)
        run: |
          set -euo pipefail
          hash_dist() {
            local files
            files=$(find packages/*/dist \
              -type f \( -name '*.js' -o -name '*.d.ts' -o -name '*.map' \) | sort)
            if [ -z "$files" ]; then
              echo "determinism gate: no dist files found" >&2
              return 1
            fi
            echo "$files" | xargs sha256sum | sha256sum
          }
          bun run build:uncached
          hash_dist | tee /tmp/build-first.sha
          rm -rf packages/*/dist \
            packages/*/*.tsbuildinfo
          bun run build:uncached
          hash_dist | tee /tmp/build-second.sha
          cmp /tmp/build-first.sha /tmp/build-second.sha
      - name: Verify Turbo graph and cache restoration in isolation
        run: bun run verify:turbo-cache

  tools:
    runs-on: ubuntu-latest
    steps:
      # These tests do not consume the separately published draft corpus.
      - uses: actions/checkout@v4
      - name: Run JEV caller tests (mocked, no credentials)
        run: python3 -m unittest discover -s tools -p "test_jev.py"
      - name: Run parser boundary tests (excluding stale corpus test)
        run: |
          python3 -c "
          import sys, unittest
          sys.path.insert(0, 'tools')
          import test_can_parser
          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for name in loader.getTestCaseNames(test_can_parser.CanParserTests):
              if 'corpus' not in name:
                  suite.addTest(test_can_parser.CanParserTests(name))
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          "
  prototype-corpus:
    # The existing prototype corpus check is informational. Keep its source
    # prerequisite and failure visible without blocking independent tool tests.
    name: Draft prototype corpus (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Parse the .can corpus (known prototype drift)
        run: python3 tools/can_parser.py draft examples
