# Lane 05 CI: build + test the owned @canlang/ui workspace package. Install runs
# at the root workspace from the committed lane-07-owned bun.lock.
name: lane-05

permissions:
  contents: read

on:
  push:
    branches:
      - 'muse/lane-05-ui/**'
    paths:
      - 'packages/ui/**'
      - 'packages/contracts/src/presentation.ts'
      - '.github/workflows/lane-05.yml'
  pull_request:
    paths:
      - 'packages/ui/**'
      - 'packages/contracts/src/presentation.ts'
      - '.github/workflows/lane-05.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Guard package API imports
        run: |
          # Consumers use declared exports; a sibling source path bypasses the producer build.
          if grep -RnE "(\.\./)+contracts/(src|dist)/" packages/ui/src packages/ui/test; then
            exit 1
          fi
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Build consumed contracts
        run: bun run build --filter=@canlang/contracts
      - name: Test owned package
        run: bun run --filter @canlang/ui test
