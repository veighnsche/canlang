[package]
name = "canlang-compiler"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
publish = false

[lib]
name = "canlang_compiler"
path = "src/lib.rs"

[[bin]]
name = "can"
path = "src/main.rs"

[dependencies]
# Constant defaults share the private owning Values constructor and wire codec.
values-semantics = { path = "../packages/values/semantics", version = "=0.1.0" }

# Ordinary HTTP(S) value admission; keep authored values after parsing.
url = { version = "=2.5.8", default-features = false, features = ["std"] }
# Stable byte-hash adapter; no optional assembly or serialization features.
sha2 = { version = "=0.10.9", default-features = false }
# Destination-local owned temporary files with the normal random-name profile.
tempfile = { version = "=3.27.0", default-features = false, features = ["getrandom"] }

# Shared library parsing and typed output with compatibility views.
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "raw_value"] }

# Protocol output DTOs only; input IDs/admission and framing remain owned here.
lsp-types = { version = "=0.97.0", default-features = false }

# Standard source-map codec; Can retains its original byte-coordinate adapter.
sourcemap = { version = "=9.3.2", default-features = false }

# B5/J1 release profile: small stripped single-binary CLI. `panic` stays
# `unwind` (the default): `main` catches panics into E7005/exit 2.
[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
