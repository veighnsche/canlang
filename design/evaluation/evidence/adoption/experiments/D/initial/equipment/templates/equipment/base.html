<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipment requests</title>
<style>body{font:1rem system-ui;max-width:68rem;margin:auto;padding:1rem;line-height:1.5}input,textarea,select,button{font:inherit;padding:.5rem;max-width:100%;box-sizing:border-box}textarea{width:100%}table{border-collapse:collapse;width:100%}th,td{padding:.5rem;text-align:left;border-bottom:1px solid #aaa}.scroll{overflow:auto}fieldset{margin:1rem 0}a{color:#0056a6}:focus-visible{outline:3px solid #986100}.errorlist,[role=alert]{color:#a01818}nav{display:flex;gap:1rem;flex-wrap:wrap}.inline{display:inline}code{overflow-wrap:anywhere}@media(max-width:40rem){body{padding:.6rem}input,textarea{width:100%}td{min-width:8rem}}</style></head>
<body><a href="#main">Skip to content</a><header><h1>Equipment requests</h1><nav><a href="{% url 'equipment-list' %}">Requests</a><a href="{% url 'equipment-create' %}">Create</a><a href="{% url 'equipment-upload' %}">CSV intake</a>{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Sign out</button></form>{% endif %}</nav></header><main id="main">{% block content %}{% endblock %}</main></body></html>
