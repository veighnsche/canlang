[package]
name = "canlang-work-kernel"
version = "0.1.0"
edition = "2021"

[lib]
name = "canlang_work_kernel"
crate-type = ["cdylib", "rlib"]
path = "rust/lib.rs"

[dependencies]
percent-encoding = { version = "=2.3.2", default-features = false }
ryu-js = { version = "=1.0.3", default-features = false }

[dev-dependencies]
serde_json = "=1.0.151"
