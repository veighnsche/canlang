[package]
name = "loader-smoke"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "C04.1 tiny precompiled binding: loader/ABI smoke only, no semantics"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = "s"
lto = true
