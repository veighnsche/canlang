[package]
name = "values-semantics"
version = "0.1.0"
edition = "2021"
publish = false
description = "Private native core for @canlang/values exact arithmetic (no public API)"
license = "MIT OR Apache-2.0"

[lib]
name = "values_semantics"
path = "src/lib.rs"

[dependencies]
ryu-js = { version = "=1.0.3", default-features = false, features = [] }
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
